name: Security - OWASP ZAP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Normalize Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Build Docker image
        run: docker build -f dockerfile -t e-signature-app .

      - name: Run application container
        run: docker run -d --name e-signature-app -p 8080:8080 e-signature-app

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs e-signature-app
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: "http://localhost:8080"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-baseline-report"
          cmd_options: "-a"

      - name: Show application logs
        if: always()
        run: docker logs e-signature-app

      - name: Stop application container
        if: always()
        run: docker stop e-signature-app