name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test

      - name: Package application
        run: ./mvnw clean package

      - name: Build Docker image
        run: docker build -t e-signature-app .
